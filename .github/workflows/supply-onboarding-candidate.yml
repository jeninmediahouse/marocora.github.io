name: Verify supply onboarding candidate

on:
  push:
    branches: [codex/supply-onboarding-candidate]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: brew install postgresql@17
      - run: echo "QUOTE_PG_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:production
      - run: pnpm test

  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#17243c;background:#f5f7f7}
    *{box-sizing:border-box}body{margin:0}
    header{background:#fff;border-bottom:1px solid #dce5e1;padding:18px max(20px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{color:#164b38;font-size:22px;font-weight:750;text-decoration:none}.back{display:inline-block;margin-bottom:20px;color:#164b38;font-weight:700;text-decoration:none}
    select{font:inherit;padding:9px 14px;border:1px solid #b7c9c0;border-radius:8px;background:#fff;color:#17243c}
    main{max-width:1000px;margin:32px auto;padding:0 20px 40px}
    .preview{background:#fff8e7;border:1px solid #e3c878;border-radius:10px;padding:12px 18px;color:#5b4714;font-size:14px;margin-bottom:20px}
    article{background:#fff;border:1px solid #dce5e1;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px #14241b0b}
    .hero{padding:32px;display:flex;align-items:center;gap:24px;background:linear-gradient(120deg,#e9f2ed,#fff);border-bottom:1px solid #dce5e1}
    .avatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#164b38;color:#fff;font-size:30px;font-weight:700;flex:none}
    h1{font-size:32px;margin:0 0 8px}.subtitle{margin:0;color:#446157;font-size:17px;line-height:1.5}
    .content{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:32px;padding:32px}
    h2{font-size:20px;margin:0 0 14px}p{line-height:1.7}.bio{margin-top:0}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0 28px}.chip{background:#edf5ef;color:#164b38;border-radius:50px;padding:8px 12px;font-size:14px}
    aside{border:1px solid #dce5e1;border-radius:12px;padding:22px;height:fit-content}dl{margin:0}dt{font-weight:700;margin-top:18px}dd{margin:6px 0 0;line-height:1.5;color:#41534c}
    .disclosure{font-size:13px;color:#56645e;border-top:1px solid #dce5e1;margin-top:22px;padding-top:16px}
    [dir=rtl] .hero,[dir=rtl] .content{text-align:right}
    @media(max-width:700px){header{padding:16px 20px}.hero{padding:24px;align-items:flex-start}.avatar{width:64px;height:64px;font-size:22px}h1{font-size:26px}.content{grid-template-columns:1fr;padding:24px}}
  </style>
</head>
<body>
  <header><a class="brand" id="home" href="index.html">Marocora</a></header>
  <main>
    <a class="back" id="back" href="translators.html" data-text="back"></a>
    <article>
      <div class="hero"><div class="avatar" aria-hidden="true">TN</div><div><h1>Tanya Naser</h1><p class="subtitle" data-text="role"></p></div></div>

      </div>
    </article>
  </main>
  <script>
    const copy={
      en:{back:'← Back to translation services',role:'Arabic and English document translator · Raleigh, North Carolina',aboutTitle:'About Tanya',bio:'I am an Arabic and English document translator based in Raleigh, North Carolina. I translate from English into Arabic and from Arabic into English. I have 17 years of professional experience and have lived in the United States for 20 years. I work remotely and provide custom quotes based on each document’s requirements.',servicesTitle:'Services',documents:'Document translation',languagesTitle:'Language directions',directions:'English → Arabic · Arabic → English',pricingTitle:'Pricing',pricing:'Custom quotes based on each document’s requirements.',locationTitle:'Based in',location:'Raleigh, North Carolina, United States',availabilityTitle:'Availability',availability:'Remote only',disclosure:'This profile contains provider-declared information. No credential verification, booking or payment is confirmed through this page.'},
      ar:{back:'← العودة إلى خدمات الترجمة',role:'مترجمة وثائق بين العربية والإنجليزية · رالي، كارولاينا الشمالية',aboutTitle:'نبذة عن تانيا',bio:'أنا مترجمة وثائق بين العربية والإنجليزية، مقيمة في رالي بولاية كارولاينا الشمالية. أترجم من الإنجليزية إلى العربية ومن العربية إلى الإنجليزية. لدي 17 عامًا من الخبرة المهنية، وعشت في الولايات المتحدة 20 عامًا. أعمل عن بُعد وأقدّم عروض أسعار مخصصة وفق متطلبات كل وثيقة.',servicesTitle:'الخدمات',documents:'ترجمة الوثائق',languagesTitle:'اتجاهات الترجمة',directions:'من الإنجليزية إلى العربية · من العربية إلى الإنجليزية',pricingTitle:'التسعير',pricing:'عروض أسعار مخصصة وفق متطلبات كل وثيقة.',locationTitle:'المقر',location:'رالي، كارولاينا الشمالية، الولايات المتحدة',availabilityTitle:'التوفر',availability:'عن بُعد فقط',disclosure:'يحتوي هذا الملف على معلومات صرّحت بها مقدمة الخدمة. لا تؤكد هذه الصفحة التحقق من المؤهلات أو الحجز أو الدفع.'},
      fr:{back:'← Retour aux services de traduction',role:'Traductrice de documents arabe–anglais · Raleigh, Caroline du Nord',aboutTitle:'À propos de Tanya',bio:'Je suis traductrice de documents arabe–anglais basée à Raleigh, en Caroline du Nord. Je traduis de l’anglais vers l’arabe et de l’arabe vers l’anglais. J’ai 17 ans d’expérience professionnelle et j’ai vécu 20 ans aux États-Unis. Je travaille à distance et propose des devis personnalisés selon les exigences de chaque document.',servicesTitle:'Services',documents:'Traduction de documents',languagesTitle:'Directions linguistiques',directions:'Anglais → arabe · Arabe → anglais',pricingTitle:'Tarification',pricing:'Devis personnalisés selon les exigences de chaque document.',locationTitle:'Basée à',location:'Raleigh, Caroline du Nord, États-Unis',availabilityTitle:'Disponibilité',availability:'À distance uniquement',disclosure:'Ce profil contient des informations déclarées par la prestataire. Cette page ne confirme ni vérification de diplôme, ni réservation, ni paiement.'},
      es:{back:'← Volver a los servicios de traducción',role:'Traductora de documentos árabe–inglés · Raleigh, Carolina del Norte',aboutTitle:'Sobre Tanya',bio:'Soy traductora de documentos de árabe e inglés con sede en Raleigh, Carolina del Norte. Traduzco del inglés al árabe y del árabe al inglés. Tengo 17 años de experiencia profesional y he vivido 20 años en Estados Unidos. Trabajo a distancia y preparo presupuestos personalizados según los requisitos de cada documento.',servicesTitle:'Servicios',documents:'Traducción de documentos',languagesTitle:'Direcciones lingüísticas',directions:'Inglés → árabe · Árabe → inglés',pricingTitle:'Precios',pricing:'Presupuestos personalizados según los requisitos de cada documento.',locationTitle:'Ubicación',location:'Raleigh, Carolina del Norte, Estados Unidos',availabilityTitle:'Disponibilidad',availability:'Solo a distancia',disclosure:'Este perfil contiene información declarada por la proveedora. Esta página no confirma verificación de títulos, reservas ni pagos.'}
    };
    function render(locale){const c=copy[locale]||copy.en;document.documentElement.lang=locale;document.documentElement.dir=locale==='ar'?'rtl':'ltr';for(const node of document.querySelectorAll('[data-text]'))node.textContent=c[node.dataset.text];document.getElementById('home').href=`index.html?lang=${locale}`;document.getElementById('back').href=`translators.html?lang=${locale}`;const url=new URL(location.href);url.searchParams.set('lang',locale);history.replaceState(null,'',url)}
    document.addEventListener('marocora:language',event=>render(event.detail.locale));render(new URL(location.href).searchParams.get('lang')||'en');
  </script>

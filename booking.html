<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Online Lesson | Marocora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 24px;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .booking-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .intro {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 28px;
        }
.booking-summary {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 22px;
}

.booking-summary h2 {
    margin-top: 0;
    margin-bottom: 18px;
    font-size: 22px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
}

.summary-row:last-child {
    border-bottom: none;
}

.summary-row span {
    text-align: right;
    color: #4b5563;
}
.student-information {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid #e5e7eb;
}

.student-information h2 {
    margin: 0 0 20px;
    font-size: 22px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    color: #111827;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font: inherit;
    color: #111827;
    background: white;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #168a55;
}

.form-group textarea {
    resize: vertical;
}
.submit-booking-button {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px 20px;
    background: #c91f25;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.submit-booking-button:hover {
    background: #a9181e;
}
      
      
      
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo">Marocora</a>
        <a href="teacher-sample.html" class="back-link">← Back to Teacher Profile</a>
    </div>
</header>

<main>
    <div class="booking-card">
        <h1>Book Your Online Lesson</h1>

        <p class="intro">
            Review your selected teacher and lesson time, then enter your information
            to continue with the booking.
        </p>
   <div class="booking-summary">
    <h2>Lesson Details</h2>

    <div class="summary-row">
        <strong>Teacher:</strong>
        <span id="selected-teacher">Sample Darija Teacher</span>
    </div>

    <div class="summary-row">
        <strong>Selected Time:</strong>
        <span id="selected-time">Loading selected time...</span>
    </div>

    <div class="summary-row">
        <strong>Lesson Type:</strong>
        <span>Online</span>
    </div>
</div>
<form class="student-information" id="booking-form">
  <h2>Your Information</h2>

  <div class="form-group">
    <label for="student-name">Full Name</label>
    <input type="text" id="student-name" name="student-name" required>
  </div>

  <div class="form-group">
    <label for="student-email">Email Address</label>
    <input type="email" id="student-email" name="student-email" required>
  </div>

  <div class="form-group">
    <label for="student-phone">Phone / WhatsApp</label>
    <input type="tel" id="student-phone" name="student-phone">
  </div>

  <div class="form-group">
    <label for="student-notes">Message to Teacher</label>
    <textarea id="student-notes" name="student-notes" rows="4" placeholder="Tell the teacher anything they should know before the lesson."></textarea>
  </div>
<button type="submit" class="submit-booking-button">
  Continue Booking
</button>
  
</form>
      
    </div>
</main>
<script src="teachers-data.js"></script>
    <script src="booking-data.js"></script>
    <script>
const params = new URLSearchParams(window.location.search);

const selectedTeacher = params.get('teacher');
const selectedTime = params.get('time');

const teacher = marocoraTeachers.find(
    teacher => teacher.id === selectedTeacher
);

if (teacher) {
    document.getElementById('selected-teacher').textContent =
        teacher.profile.displayName;
} else {
    document.getElementById('selected-teacher').textContent =
        'Teacher not found';
}

if (selectedTime) {
    document.getElementById('selected-time').textContent = selectedTime;
} else {
    document.getElementById('selected-time').textContent =
        'No lesson time selected';
}
const bookingForm = document.getElementById('booking-form');

bookingForm.addEventListener('submit', function(event) {
    event.preventDefault();

    const studentName = document.getElementById('student-name').value.trim();
    const studentEmail = document.getElementById('student-email').value.trim();
    const studentPhone = document.getElementById('student-phone').value.trim();
    const studentNotes = document.getElementById('student-notes').value.trim();

    const confirmationParams = new URLSearchParams({
        teacher: selectedTeacher || '',
        time: selectedTime || '',
        name: studentName,
        email: studentEmail,
        phone: studentPhone,
        notes: studentNotes
    });

    window.location.href =
        'booking-confirmation.html?' + confirmationParams.toString();
});
    
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Reset your password | Marocora</title><link rel="stylesheet" href="site-language.css"><link rel="stylesheet" href="learning-room.css"><script type="module" src="reset-password.mjs"></script><script type="module" src="site-language.mjs"></script></head><body data-password-reset><main><h1>Reset your password</h1><p id="reset-status" role="status" aria-live="polite">Enter the code from your email.</p><form id="password-reset" novalidate><p><label>Email <input name="email" type="email" autocomplete="username" maxlength="320" required></label></p><p><label>Recovery code <input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label></p><p><label>New password <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label></p><p><label>Confirm new password <input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label></p><p>Password must be 12 to 128 characters.</p><button type="submit">Save new password</button><p><button id="send-new-code" type="button">Send a new code</button></p></form><p><a href="production-login.html?next=%2Fsupply-dashboard.html">Return to sign in</a></p></main></body></html>

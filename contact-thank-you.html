<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message Received | Jenin Media House</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #111827;
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.card {
    width: 100%;
    max-width: 520px;
    background: white;
    border: 1px solid #d9dee5;
    border-radius: 10px;
    padding: 38px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
}

.check {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 14px;
}

h1 {
    font-size: 25px;
    margin: 0 0 18px;
}

p {
    font-size: 15px;
    line-height: 1.7;
    color: #374151;
    margin-bottom: 25px;
}

.button {
    display: block;
    width: 100%;
    background: #d52027;
    color: white;
    text-decoration: none;
    font-weight: bold;
    padding: 13px 18px;
    border-radius: 5px;
    margin-bottom: 10px;
}

.secondary-button {
    display: block;
    width: 100%;
    background: white;
    color: #111827;
    text-decoration: none;
    font-weight: bold;
    padding: 12px 18px;
    border: 1px solid #bfc7d1;
    border-radius: 5px;
}

.footer {
    margin-top: 28px;
    font-size: 12px;
    color: #6b7280;
}
</style>
</head>

<body>

<main class="page">

    <div class="card">

        <div class="check">✓</div>

        <h1>Message Received</h1>

        <p>
            Thank you for contacting Jenin Media House.
            We have successfully received your message and will review
            your inquiry as soon as possible.
        </p>

        <a href="contact.html" class="button">
            Send Another Message
        </a>

        <a href="index.html" class="secondary-button">
            Return to Jenin Media House
        </a>

        <div class="footer">
            Jenin Media House · Casablanca–Nouaceur, Morocco
        </div>

    </div>

</main>

</body>
</html>

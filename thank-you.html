<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Received | Jenin Media House</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .header {
      background: #111827;
      padding: 18px 24px;
    }

    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
    }

    .logo {
      color: white;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    .page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: white;
      max-width: 650px;
      width: 100%;
      padding: 50px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .check {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 18px;
      font-size: 32px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #4b5563;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      background: #b91c1c;
      color: white;
      padding: 14px 25px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="index.html">JENIN MEDIA HOUSE</a>
  </div>
</header>

<main class="page">

  <div class="card">

    <div class="check">✓</div>

    <h1>Application Received</h1>

    <p>
      Thank you for applying to join the JMH Professional Network.
    </p>

    <p>
      We have successfully received your application. Our team will review
      your information and contact you if additional information is required.
    </p>

    <a class="button" href="index.html">
      Return to Jenin Media House
    </a>

  </div>

</main>

</body>
</html>
